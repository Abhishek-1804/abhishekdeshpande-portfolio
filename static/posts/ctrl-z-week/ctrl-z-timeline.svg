<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Timeline: Nvidia CEO resigns Nov 11, Java4Shell Nov 17, Huang reinstated Nov 22, Shirudo and GLM-5.4 Nov 23">
  <rect x="0" y="0" width="820" height="300" rx="14" fill="#1b1d27"/>
  <text x="410" y="36" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#f5f5f5">Nov 11 → Nov 23: the Ctrl+Z speedrun</text>
  <line x1="70" y1="160" x2="750" y2="160" stroke="#5c6070" stroke-width="3" stroke-linecap="round"/>
  <!-- undo arc from Nov 11 to Nov 22 -->
  <path d="M 70 150 C 150 70, 560 70, 620 150" fill="none" stroke="#76b900" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="345" y="80" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#76b900">↶ 11 days later: Ctrl+Z</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#d8dae3">
    <circle cx="70" cy="160" r="8" fill="#ef4444"/>
    <line x1="70" y1="168" x2="70" y2="200" stroke="#ef4444" stroke-width="2"/>
    <text x="60" y="222" font-weight="700" fill="#ef4444">Nov 11</text>
    <text x="60" y="240">Jensen out</text>
    <text x="60" y="256" fill="#9ca0b0">NVDA −14% intraday</text>

    <circle cx="380" cy="160" r="8" fill="#f97316"/>
    <line x1="380" y1="168" x2="380" y2="200" stroke="#f97316" stroke-width="2"/>
    <text x="380" y="222" text-anchor="middle" font-weight="700" fill="#f97316">Nov 17</text>
    <text x="380" y="240" text-anchor="middle">Java4Shell</text>
    <text x="380" y="256" text-anchor="middle" fill="#9ca0b0">Base64 → RCE</text>

    <circle cx="620" cy="160" r="8" fill="#76b900"/>
    <line x1="620" y1="168" x2="620" y2="200" stroke="#76b900" stroke-width="2"/>
    <text x="604" y="222" text-anchor="middle" font-weight="700" fill="#76b900">Nov 22</text>
    <text x="604" y="240" text-anchor="middle">Jensen back</text>
    <text x="604" y="256" text-anchor="middle" fill="#9ca0b0">announced Nov 23</text>

    <circle cx="750" cy="160" r="10" fill="#38bdf8"/>
    <line x1="750" y1="172" x2="750" y2="200" stroke="#38bdf8" stroke-width="2"/>
    <text x="770" y="222" text-anchor="end" font-weight="700" fill="#38bdf8">Nov 23</text>
    <text x="770" y="240" text-anchor="end">Shirudo</text>
    <text x="770" y="256" text-anchor="end" fill="#9ca0b0">+ GLM-5.4</text>
  </g>
</svg>
