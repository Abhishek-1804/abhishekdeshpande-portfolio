<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Shadow traffic: each live request is served by the Python service while a copy goes to the Rust service; a verifier compares the two stage by stage">
  <title>Shadow traffic: how the Rust rewrite was verified</title>
  <rect x="0" y="0" width="820" height="270" rx="14" fill="#1b1d27"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca0b0"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d8dae3" font-size="13">
    <text x="30" y="34" font-size="16" font-weight="700" fill="#f5f5f5">Shadow traffic: the old service answers, the new one gets graded</text>

    <!-- request -->
    <rect x="30" y="110" width="130" height="46" rx="8" fill="#2b2f3d" stroke="#9ca0b0"/>
    <text x="95" y="138" text-anchor="middle">live request</text>

    <!-- python -->
    <rect x="250" y="62" width="180" height="46" rx="8" fill="#2b2f3d" stroke="#facc15"/>
    <text x="340" y="84" text-anchor="middle" fill="#f5f5f5">🐍 Python service</text>
    <text x="340" y="100" text-anchor="middle" font-size="11" fill="#9ca0b0">serves the customer</text>

    <!-- rust -->
    <rect x="250" y="160" width="180" height="46" rx="8" fill="#2b2f3d" stroke="#fb923c"/>
    <text x="340" y="182" text-anchor="middle" fill="#f5f5f5">🦀 Rust service</text>
    <text x="340" y="198" text-anchor="middle" font-size="11" fill="#9ca0b0">same input, never replies</text>

    <!-- verifier -->
    <rect x="530" y="110" width="160" height="46" rx="8" fill="#2b2f3d" stroke="#a3e635"/>
    <text x="610" y="132" text-anchor="middle" fill="#f5f5f5">verifier</text>
    <text x="610" y="148" text-anchor="middle" font-size="11" fill="#9ca0b0">diff, stage by stage</text>

    <g stroke="#9ca0b0" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M 160,124 C 205,124 205,85 248,85"/>
      <path d="M 160,142 C 205,142 205,183 248,183"/>
      <path d="M 430,85 C 480,85 480,124 528,124"/>
      <path d="M 430,183 C 480,183 480,142 528,142"/>
      <path d="M 690,133 L 778,133"/>
    </g>
    <text x="734" y="122" text-anchor="middle" font-size="12" fill="#a3e635">match?</text>
    <text x="734" y="152" text-anchor="middle" font-size="11" fill="#9ca0b0">→ cut over</text>

    <text x="410" y="246" text-anchor="middle" font-size="12" fill="#9ca0b0">The model is not called twice. Customers only ever see the Python answer until the diffs go quiet.</text>
  </g>
</svg>
