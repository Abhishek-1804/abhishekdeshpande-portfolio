<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-label="Starmind FCC milestones: 1 satellite by 2033, 100,000 by 2035, 500,000 by 2038, and 1,000,000 by 2040">
  <title>Starmind deployment milestones (FCC order, Nov 25 2026)</title>
  <rect x="0" y="0" width="820" height="310" rx="14" fill="#1b1d27"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d8dae3">
    <text x="30" y="34" font-size="16" font-weight="700" fill="#f5f5f5">Starmind: satellites required by each FCC deadline</text>
    <text x="30" y="54" font-size="12" fill="#9ca0b0">Miss a milestone and the license is void</text>

    <!-- grid -->
    <g stroke="#2e3140" stroke-width="1">
      <line x1="100" y1="80" x2="790" y2="80"/>
      <line x1="100" y1="125" x2="790" y2="125"/>
      <line x1="100" y1="170" x2="790" y2="170"/>
      <line x1="100" y1="215" x2="790" y2="215"/>
    </g>
    <line x1="100" y1="260" x2="790" y2="260" stroke="#5a5e70" stroke-width="1.5"/>
    <g font-size="11" fill="#9ca0b0" text-anchor="end">
      <text x="90" y="84">1M</text>
      <text x="90" y="129">750k</text>
      <text x="90" y="174">500k</text>
      <text x="90" y="219">250k</text>
      <text x="90" y="264">0</text>
    </g>

    <!-- bars (heights scaled 180px = 1,000,000) -->
    <g fill="#0ea5e9">
      <rect x="150" y="258" width="90" height="2"/>
      <path d="M 320,260 V 246 Q 320,242 324,242 H 406 Q 410,242 410,246 V 260 Z"/>
      <path d="M 490,260 V 174 Q 490,170 494,170 H 576 Q 580,170 580,174 V 260 Z"/>
      <path d="M 660,260 V 84 Q 660,80 664,80 H 746 Q 750,80 750,84 V 260 Z"/>
    </g>

    <!-- value labels -->
    <g font-size="13" font-weight="700" fill="#f5f5f5" text-anchor="middle">
      <text x="195" y="246">1</text>
      <text x="365" y="234">100,000</text>
      <text x="535" y="162">500,000</text>
      <text x="705" y="72" fill="#f5f5f5">1,000,000</text>
    </g>
    <text x="195" y="222" font-size="11" fill="#facc15" text-anchor="middle">↓ yes, one</text>

    <!-- x labels -->
    <g font-size="12" fill="#d8dae3" text-anchor="middle">
      <text x="195" y="282">Nov 2033</text>
      <text x="365" y="282">2035</text>
      <text x="535" y="282">2038</text>
      <text x="705" y="282">Nov 2040</text>
    </g>
    <text x="790" y="302" font-size="10" fill="#9ca0b0" text-anchor="end">Milestones as reported from the FCC order</text>
  </g>
</svg>
