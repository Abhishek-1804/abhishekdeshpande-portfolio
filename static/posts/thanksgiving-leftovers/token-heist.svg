<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Reported SAP incident: stolen employee tokens were used to copy and alter code on GitHub; SAP responded by restricting GitHub access, pausing automated workflows, and replacing signing keys">
  <title>SAP incident: how one stolen token turns into a repo problem</title>
  <rect x="0" y="0" width="820" height="300" rx="14" fill="#1b1d27"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca0b0"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d8dae3" font-size="13">
    <text x="30" y="34" font-size="16" font-weight="700" fill="#f5f5f5">One stolen token, a whole lot of git log</text>
    <text x="30" y="54" font-size="11" fill="#9ca0b0">attack path as reported by Der Spiegel · SAP has not confirmed these details</text>

    <!-- attack row -->
    <rect x="30" y="80" width="190" height="56" rx="8" fill="#2b2f3d" stroke="#f87171"/>
    <text x="125" y="104" text-anchor="middle" fill="#f5f5f5">🔑 employee tokens</text>
    <text x="125" y="122" text-anchor="middle" font-size="11" fill="#9ca0b0">stolen (how: unknown)</text>

    <rect x="315" y="80" width="190" height="56" rx="8" fill="#2b2f3d" stroke="#f87171"/>
    <text x="410" y="104" text-anchor="middle" fill="#f5f5f5">🐙 GitHub repos</text>
    <text x="410" y="122" text-anchor="middle" font-size="11" fill="#9ca0b0">logged in as "them"</text>

    <rect x="600" y="80" width="190" height="56" rx="8" fill="#2b2f3d" stroke="#f87171"/>
    <text x="695" y="104" text-anchor="middle" fill="#f5f5f5">📋 copy + ✏️ alter</text>
    <text x="695" y="122" text-anchor="middle" font-size="11" fill="#9ca0b0">source code (AI agents?)</text>

    <g stroke="#9ca0b0" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M 220,108 L 313,108"/>
      <path d="M 505,108 L 598,108"/>
    </g>

    <!-- response row -->
    <text x="30" y="178" font-size="12" fill="#a3e635">Response ("Project Granite", per Handelsblatt):</text>
    <rect x="30" y="192" width="230" height="46" rx="8" fill="#2b2f3d" stroke="#a3e635"/>
    <text x="145" y="220" text-anchor="middle">🚪 restrict GitHub access</text>
    <rect x="295" y="192" width="230" height="46" rx="8" fill="#2b2f3d" stroke="#a3e635"/>
    <text x="410" y="220" text-anchor="middle">⏸️ pause automated workflows</text>
    <rect x="560" y="192" width="230" height="46" rx="8" fill="#2b2f3d" stroke="#a3e635"/>
    <text x="675" y="220" text-anchor="middle">🔏 replace signing keys</text>

    <text x="410" y="276" text-anchor="middle" font-size="12" fill="#9ca0b0">SAP: "no evidence of unauthorized access to customer business data" so far.</text>
  </g>
</svg>
