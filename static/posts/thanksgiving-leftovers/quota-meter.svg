<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Approximate quota used by the same work after OpenAI's billing fix: about 1.4 times on Astra and 1.25 times on Sol, versus the week before">
  <title>Same prompt, bigger bite of your quota</title>
  <rect x="0" y="0" width="820" height="270" rx="14" fill="#1b1d27"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d8dae3" font-size="13">
    <text x="30" y="34" font-size="16" font-weight="700" fill="#f5f5f5">Same prompt, bigger bite of your quota</text>
    <text x="30" y="54" font-size="11" fill="#9ca0b0">quota used by the same work, relative to launch week (approx., from "hit limits ~40% / ~25% faster")</text>

    <!-- gridline at 1.0x -->
    <line x1="560" y1="70" x2="560" y2="228" stroke="#4b4f60" stroke-dasharray="4 4"/>
    <text x="560" y="244" text-anchor="middle" font-size="11" fill="#9ca0b0">1.0x</text>

    <!-- scale: 1.0x = 400px starting at x=160 -->
    <text x="30" y="100">launch week</text>
    <rect x="160" y="84" width="400" height="26" rx="4" fill="#6b7280"/>
    <text x="570" y="102" fill="#f5f5f5">1.0x  "wow, so generous"</text>

    <text x="30" y="150">Astra now</text>
    <rect x="160" y="134" width="560" height="26" rx="4" fill="#f87171"/>
    <text x="730" y="152" fill="#f5f5f5">~1.4x</text>

    <text x="30" y="200">Sol now</text>
    <rect x="160" y="184" width="500" height="26" rx="4" fill="#fb923c"/>
    <text x="670" y="202" fill="#f5f5f5">~1.25x</text>
  </g>
</svg>
